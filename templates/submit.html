{% extends "base_public.html" %}

{% block title %}
Student Registration
{% endblock %}

{% block content %}

<h1>Library Card Application</h1>

<form method="POST" enctype="multipart/form-data">

    <label>Surname:</label><br>
    <input type="text" name="surname" required><br><br>

    <label>Other Names:</label><br>
    <input type="text" name="other_names" required><br><br>

    <label>Faculty:</label><br>
    <input type="text" name="faculty" required><br><br>

    <label>Department:</label><br>
    <input type="text" name="department" required><br><br>

    <label>Year of Entry:</label><br>
    <input type="number" name="year_of_entry" required><br><br>

    <label>Matric No / Session:</label><br>
    <input type="text" name="matric_no" required><br><br>

    <label>Passport Photo:</label><br>
    <input type="file" name="passport" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <label>Confirm Password:</label><br>
    <input type="password" name="confirm_password" required><br><br>

    <button type="submit">
        Submit
    </button>

</form>

{% endblock %}
