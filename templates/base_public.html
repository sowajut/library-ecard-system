<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            margin:0;
            background:#f4f6f9;
        }

        .navbar{
            background:#003366;
            padding:15px;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-right:20px;
            font-weight:bold;
        }

        .container{
            padding:20px;
        }

        .hero-btn{
            display:inline-block;
            background:#003366;
            color:white;
            text-decoration:none;
            padding:15px 25px;
            border-radius:8px;
            margin:10px;
            font-weight:bold;
        }

        .hero-btn:hover{
            background:#00509e;
        }

    </style>

</head>
<body>

{% if request.path != "/" %}

<div class="navbar">

    <a href="/">🏠 Home</a>

</div>

{% endif %}

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
