{% extends "base_public.html" %}

{% block title %}
Student Login
{% endblock %}

{% block content %}

<h1>Student Login</h1>

<form method="POST">

    <label>Matric Number:</label><br>
    <input type="text" name="matric_no" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
