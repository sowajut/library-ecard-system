{% extends "base_public.html" %}

{% block title %}
Admin Login
{% endblock %}

{% block content %}

<h1>Library Staff Login</h1>

<form method="POST">

    <label>Username:</label><br>
    <input type="text" name="username" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
